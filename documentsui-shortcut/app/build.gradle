plugins {
    id "com.android.application"
}

android {
    namespace "com.documentsui.shortcut"
    compileSdk 36

    defaultConfig {
        applicationId "com.documentsui.shortcut"
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName "1.2.0"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }

    // No extra signing blob in the APK (smaller, and reproducible-build friendly).
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}
